<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Aai Matha Light House — Admin</title><style>body{font-family:system-ui,Arial;background:#f5f7fb;color:#172033;margin:0;padding:18px}main{max-width:900px;margin:auto}.card{background:white;border:1px solid #e1e5ed;border-radius:14px;padding:18px;margin:14px 0}input,select,textarea,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #d7dce5;margin:5px 0;max-width:100%}button{background:#172844;color:white;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}.item{padding:12px 0;border-bottom:1px solid #eee;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.item img{width:58px;height:58px;object-fit:contain}.hidden{display:none}.note{color:#667085;font-size:13px;line-height:1.5}#status{white-space:pre-wrap;color:#9a3412}</style></head><body><main><h1>💡 Aai Matha Light House — Admin</h1><p>Admin-only product management. Customer page: <a href="index.html">Open store</a></p><section class="card" id="login"><h2>Admin login</h2><p class="note">Create your admin user first in Supabase Authentication → Users. Do not share your password.</p><input id="email" type="email" placeholder="Admin email"><br><input id="password" type="password" placeholder="Password"><br><button onclick="loginAdmin()">Login</button><p id="status"></p></section><section class="card hidden" id="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Manage products</h2><button onclick="logoutAdmin()">Log out</button></div><form id="productForm" onsubmit="saveProduct(event)"><input type="hidden" id="pid"><div class="grid"><input id="name" required placeholder="Product name"><input id="price" type="number" min="1" required placeholder="Price ₹"><select id="cat"><option>Outdoor Light</option><option>Wall Light</option><option>Chandelier</option><option>Ceiling Light</option><option>Duplex Hanging</option><option>Gate Light</option><option>LED Track Light</option><option>Track Light</option><option>Inslim LED Panel Light</option><option>Adore Deep Down Light</option><option>Viva Deep Down Light</option><option>Aster Surface Panel Light</option><option>Blaze Rimless Surface Light</option><option>Vista Deep COB</option><option>Opal Deep COB</option><option>Striker Light</option><option>Optima Deep Light COB</option><option>Tilt COB Light</option><option>Iris Deep COB Spot</option><option>Nano Deep COB Spot</option><option>Strip Light</option><option>Rope Light</option><option>Neon Light</option><option>Bulb</option></select></div><textarea id="description" placeholder="Description" style="width:100%"></textarea><label>Product photo <input id="photo" type="file" accept="image/*"></label><button type="submit">Save product</button><button type="button" onclick="resetForm()">Clear form</button></form><p class="note">Orders under ₹5,000 have ₹50 delivery; orders ₹5,000 or above have free delivery.</p><div id="products"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const configured=window.SUPABASE_URL&&window.SUPABASE_ANON_KEY&&!window.SUPABASE_URL.includes('PASTE_')&&!window.SUPABASE_ANON_KEY.includes('PASTE_');const db=configured?window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY):null;let editing=[];
function status(s){document.getElementById('status').textContent=s}
async function loginAdmin(){if(!db)return status('Setup required: fill in config.js with your Supabase project URL and anon key.');const {data,error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error)return status(error.message);document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');await loadProducts()}
async function logoutAdmin(){if(db)await db.auth.signOut();document.getElementById('panel').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
async function loadProducts(){const {data,error}=await db.from('products').select('*').order('id');if(error){status(error.message);return}editing=data||[];document.getElementById('products').innerHTML=editing.map(p=>`<div class="item"> <span>${p.image_url?`<img src="${p.image_url}">`:''} <b>${escapeHtml(p.name)}</b><br><small>${escapeHtml(p.category)} · ₹${Number(p.price).toLocaleString('en-IN')}</small></span><span><button onclick="editProduct(${p.id})">Edit</button><button onclick="deleteProduct(${p.id})">Delete</button></span></div>`).join('')||'<p>No products yet. Add the first product above.</p>'}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function editProduct(id){const p=editing.find(x=>x.id===id);if(!p)return;document.getElementById('pid').value=p.id;document.getElementById('name').value=p.name;document.getElementById('price').value=p.price;document.getElementById('cat').value=p.category;document.getElementById('description').value=p.description||'';window.scrollTo({top:0,behavior:'smooth'})}
function resetForm(){document.getElementById('productForm').reset();document.getElementById('pid').value=''}
async function saveProduct(e){e.preventDefault();if(!db)return;const {data:sessionData}=await db.auth.getSession();if(!sessionData.session)return status('Please log in again.');let image_url='';const id=document.getElementById('pid').value;const old=editing.find(p=>String(p.id)===String(id));image_url=old?.image_url||'';const file=document.getElementById('photo').files[0];if(file){const path=Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const {error:upErr}=await db.storage.from('product-images').upload(path,file,{upsert:true});if(upErr)return status('Photo upload failed: '+upErr.message);image_url=db.storage.from('product-images').getPublicUrl(path).data.publicUrl}const row={name:document.getElementById('name').value.trim(),price:Number(document.getElementById('price').value),category:document.getElementById('cat').value,description:document.getElementById('description').value.trim(),image_url};let result=id?await db.from('products').update(row).eq('id',Number(id)):await db.from('products').insert(row);if(result.error)return status(result.error.message);resetForm();await loadProducts();status('Product saved. Customer store updates from the shared database.')}
async function deleteProduct(id){if(!confirm('Delete this product?'))return;const {error}=await db.from('products').delete().eq('id',id);if(error)return status(error.message);await loadProducts()}
</script></body></html>
